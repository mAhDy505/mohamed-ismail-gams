<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MOHAMED ISMAIL GAMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@600;900&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D canvas, HUD pinned to the top, thumb controls pinned to the bottom, panels centred over the scene. */
  --bg:#05070d;
  --ink:#eef3fb;
  --steel:#b9c4d6;
  --steel-d:#5d6b82;
  --gold:#e6b85c;
  --cyan:#3be3ff;
  --crimson:#ff4466;
  --panel:rgba(6,10,20,.74);
  --display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --body:'Cairo','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);
  overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#hud .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lives{display:flex;gap:6px;direction:ltr}
.lives svg{width:30px;height:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));transition:opacity .25s,filter .25s,transform .25s}
.lives svg.off{opacity:.22;filter:grayscale(1)}
.lives svg.pop{animation:pop .5s ease-out}
.lives.hurt{animation:shake .4s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.score{display:flex;flex-direction:column;align-items:flex-end;line-height:1;direction:ltr}
.score .lbl{font-size:.72rem;letter-spacing:.14em;color:var(--steel);font-weight:700;direction:rtl}
.score b{font-family:var(--display);font-weight:900;font-size:1.7rem;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff,#cfd8e6 45%,#7e8ca3 55%,#e9eff8);-webkit-background-clip:text;background-clip:text;color:transparent}
#hud .sub{font-size:.8rem;color:var(--steel);font-weight:700;background:var(--panel);border-radius:10px;padding:6px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hud .sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{flex:1;min-width:40px;height:6px;border-radius:3px;background:#1a2233;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold))}
#heartTxt{white-space:nowrap;font-variant-numeric:tabular-nums}

/* Controls */
#pad{position:absolute;left:0;right:0;bottom:0;padding:34px 20px 18px;display:flex;gap:12px;justify-content:space-between;align-items:flex-end;direction:ltr;pointer-events:none;
  background:linear-gradient(0deg,rgba(3,5,10,.6),transparent)}
#pad .key{pointer-events:auto}
.key{
  font-family:var(--body);font-weight:900;color:#10151f;cursor:pointer;border:0;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,#f3f6fb 0%,#aab6ca 44%,#566278 52%,#a9b5c9 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -3px 6px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.55);
  transition:transform .06s,filter .06s;
}
.key:active,.key.down{transform:translateY(3px) scale(.98);filter:brightness(.88)}
.key:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.key.dir{flex:0 0 auto;width:96px;height:96px;border-radius:50%;opacity:.8;
  background:radial-gradient(circle at 50% 38%,#e2ffc4 0%,#8cff45 36%,#2fdc17 72%,#0f8f10 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -6px 12px rgba(0,60,0,.35),0 0 0 3px rgba(8,26,8,.75),0 0 18px 3px rgba(80,255,60,.5),0 0 44px 8px rgba(80,255,60,.22);
  transition:transform .06s,filter .12s,box-shadow .12s,opacity .12s}
.key.dir:active,.key.dir.down{opacity:1;filter:brightness(1.4) saturate(1.25);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 0 0 3px rgba(225,255,205,.95),0 0 32px 12px rgba(120,255,80,.95),0 0 90px 26px rgba(90,255,60,.6)}
.key.fire{flex:0 0 auto;width:92px;height:92px;border-radius:50%;color:#51627c;opacity:.88;
  background:radial-gradient(circle at 50% 34%,#ffffff 0%,#e6eefa 38%,#b9c9de 68%,#dbe6f4 100%);
  box-shadow:inset 0 2px 0 #fff,inset 0 -5px 10px rgba(80,100,130,.35),0 0 0 4px rgba(220,235,255,.35),0 0 0 6px rgba(170,200,235,.5),0 10px 22px rgba(0,0,0,.5)}
.key.fire svg{width:46px;height:46px}
.key.fire:active,.key.fire.down{opacity:1;filter:brightness(1.1);box-shadow:inset 0 2px 0 #fff,0 0 0 4px rgba(235,245,255,.8),0 0 28px 8px rgba(190,220,255,.8)}
.pausebtn{pointer-events:auto;height:38px;padding:0 16px;border-radius:999px;gap:6px;font-size:.9rem;color:#1c1303;
  background:linear-gradient(180deg,#fff0c4 0%,#f0c765 45%,#a8741b 55%,#e9bd55 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 5px rgba(80,40,0,.4),0 4px 12px rgba(0,0,0,.5)}
.pausebtn svg{width:16px;height:16px}
#boss .bar i{background:linear-gradient(90deg,#ff4466,#ffb36b);width:100%}
.bossl{color:var(--crimson);font-weight:900}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);max-width:88%;text-align:center;padding:10px 20px;border-radius:999px;
  background:var(--panel);border:1px solid var(--gold);color:var(--gold);font-weight:900;font-size:1.05rem;pointer-events:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.key[disabled]{opacity:.45;cursor:default}

#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,transparent 30%,rgba(255,40,70,.6))}
#flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#pauseTag{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);padding:10px 26px;border-radius:999px;
  background:var(--panel);border:1px solid var(--gold);color:var(--gold);font-weight:900;font-size:1.3rem;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* Panels */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding:24px 16px;text-align:center;background:radial-gradient(ellipse at 50% 45%,rgba(3,5,10,.38),rgba(3,5,10,.84))}
.title{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,min(9.5vw,13vh),4.6rem);line-height:1.04;letter-spacing:.07em;
  display:flex;flex-direction:column;align-items:center;direction:ltr;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
.title span{
  background:
    linear-gradient(100deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 0 0/260% 100% no-repeat,
    linear-gradient(180deg,#ffffff 0%,#d4dcea 34%,#6a7891 50%,#eaf0f9 60%,#97a4bb 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sweep 5s ease-in-out infinite;
}
.title span:nth-child(2){animation-delay:.25s}
.title span:nth-child(3){animation-delay:.5s;
  background:
    linear-gradient(100deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 0 0/260% 100% no-repeat,
    linear-gradient(180deg,#fff3cf 0%,#f0c765 38%,#8a5f12 52%,#ffe39a 62%,#c18a25 100%);
  -webkit-background-clip:text;background-clip:text}
@keyframes sweep{0%{background-position:160% 0,0 0}60%,100%{background-position:-60% 0,0 0}}
.cta{
  font-family:var(--body);font-weight:900;font-size:1.7rem;color:#1c1303;cursor:pointer;border:0;
  padding:.5em 2.6em;border-radius:16px;touch-action:manipulation;
  background:linear-gradient(180deg,#fff0c4 0%,#f0c765 42%,#a8741b 52%,#e9bd55 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -3px 8px rgba(80,40,0,.45),0 8px 26px rgba(230,184,92,.35),0 0 0 1px rgba(255,220,140,.5);
  transition:transform .1s,filter .1s}
.cta:hover{filter:brightness(1.08)}
.cta:active{transform:translateY(2px)}
.cta:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.hint{margin:0;color:var(--steel);font-size:.95rem;font-weight:700}
.big{margin:0;font-weight:900;font-size:clamp(3rem,15vw,6.5rem);line-height:1.1;
  background:linear-gradient(180deg,#fff3cf 0%,#f0c765 38%,#8a5f12 52%,#ffe39a 62%,#c18a25 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
.sub1{margin:0;font-size:1.3rem;font-weight:700;color:var(--ink)}
.sub2{margin:0;font-size:1.05rem;font-weight:700;color:var(--steel)}
.num{font-family:var(--display);font-weight:900;font-variant-numeric:tabular-nums;color:var(--cyan)}
.final{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,12vw,5rem);font-variant-numeric:tabular-nums;direction:ltr;
  background:linear-gradient(180deg,#fff,#cfd8e6 45%,#7e8ca3 55%,#e9eff8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sorry{margin:0;font-weight:900;font-size:clamp(1.5rem,6.5vw,2.3rem);color:var(--crimson);text-shadow:0 4px 18px rgba(0,0,0,.7)}
.msg{max-width:30ch;color:var(--steel);font-weight:700}
@media (prefers-reduced-motion:reduce){.title span{animation:none}.lives svg.pop,.lives.hurt,#flash.go{animation:none}}
@media (max-width:480px){.key.dir{width:90px;height:90px}.key.fire{width:82px;height:82px}.key.fire svg{width:40px;height:40px}}
@media (max-width:420px){#pauseTxt{display:none}.pausebtn{width:42px;padding:0}.lives svg{width:25px;height:25px}.lives{gap:4px}}
@media (max-width:360px){.key.dir{width:78px;height:78px}.key.fire{width:72px;height:72px}.key.fire svg{width:36px;height:36px}}
@media (max-height:480px){
  #pad{padding:20px 20px 8px}.key.dir{width:68px;height:68px}.key.dir svg{width:34px;height:34px}.key.fire{width:62px;height:62px}.key.fire svg{width:32px;height:32px}.pausebtn{height:32px;font-size:.8rem}
  .panel{gap:10px;padding:12px 16px}.cta{font-size:1.25rem}.score b{font-size:1.3rem}.lives svg{width:24px;height:24px}.big{font-size:3rem}.final{font-size:2.4rem}.sub1{font-size:1.05rem}
  #hud{gap:4px;padding-top:6px}
}
</style>

<div id="app">
  <canvas id="gl"></canvas>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9db2"/><stop offset=".55" stop-color="#e0214a"/><stop offset="1" stop-color="#8d0f2c"/></linearGradient>
  </defs></svg>

  <div id="hud" hidden>
    <div class="row">
      <div class="lives" id="lives" role="img" aria-label="الأرواح"></div>

    </div>
    <div class="row sub" id="boss" hidden>
      <span class="bossl">الوحش</span>
      <div class="bar"><i id="bossBar"></i></div>
    </div>
  </div>

  <div id="flash"></div>
  <div id="toast" hidden></div>
  <div id="pauseTag" hidden>متوقفة مؤقتًا</div>

  <div id="pad" hidden>
    <button class="key dir" id="bLeft" aria-label="يسار" type="button"></button>
    <button class="key fire" id="bFire" aria-label="إطلاق النار" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/></svg>
    </button>
    <button class="key dir" id="bRight" aria-label="يمين" type="button"></button>
  </div>

  <section class="panel" id="pMenu">
    <h1 class="title"><span>MOHAMED</span><span>ISMAIL</span><span>GAMS</span></h1>
    <button class="cta" id="startBtn" type="button">ابدأ</button>
    <p class="hint">تجنّب الحواجز واجمع القلوب</p>
    <p class="hint" id="bestMenu" hidden></p>
  </section>

  <section class="panel" id="pLevel" hidden>
    <h2 class="big">تهانينا</h2>
    <p class="sub1">أنهيت المستوى <span class="num" id="lvDone">1</span> من 10</p>
    <p class="sub2">المستوى <span class="num" id="lvNext">2</span> يبدأ بعد <span class="num" id="lvCount">3</span></p>
    <p class="sub2" id="lvHint" style="color:var(--gold)"></p>
    <button class="cta" id="nextBtn" type="button">تابع الآن</button>
  </section>

  <section class="panel" id="pOver" hidden>
    <p class="sub1">انتهت اللعبة</p>
    <p class="final" id="finalScore">0</p>
    <p class="sorry">معلش حاول مرة تانية</p>
    <p class="sub2" id="bestOver"></p>
    <button class="cta" id="againBtn" type="button">العب من جديد</button>
  </section>

  <section class="panel" id="pWin" hidden>
    <h2 class="big">تهانينا</h2>
    <p class="sub1">أنهيت المستويات العشرة كلها</p>
    <p class="final" id="winScore">0</p>
    <p class="sub2" id="bestWin"></p>
    <button class="cta" id="againBtn2" type="button">العب من جديد</button>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
if(!window.THREE){$('pMenu').insertAdjacentHTML('beforeend','<p class="msg">تعذر تحميل محرك العرض ثلاثي الأبعاد. تحقق من الاتصال ثم أعد فتح الصفحة.</p>');return;}
var T=THREE;

/* ---------- constants ---------- */
var LANES=10, LW=1.5, MID=(LANES-1)/2, TRACK_W=LANES*LW;
var LEVEL_LEN=500, MAX_LEVEL=10, HEART_EVERY=300, MAX_LIVES=5, FINISH=LEVEL_LEN*MAX_LEVEL;
var SPAWN_Z=-110, TILE=15;
function laneX(i){return (i-MID)*LW;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}

/* ---------- renderer / scene ---------- */
var app=$('app'), canvas=$('gl');
var renderer;
try{ renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ $('pMenu').insertAdjacentHTML('beforeend','<p class="msg">متصفحك لا يدعم العرض ثلاثي الأبعاد (WebGL).</p>'); return; }
var coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,coarse?1.5:2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;

var scene=new T.Scene();
var FOG=0x0b1428;
scene.fog=new T.Fog(FOG,45,150);
(function(){
  var c=document.createElement('canvas'); c.width=16; c.height=512; var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#01030a'); g.addColorStop(.35,'#071030'); g.addColorStop(.52,'#0b1428'); g.addColorStop(1,'#0b1428');
  x.fillStyle=g; x.fillRect(0,0,16,512);
  var t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; scene.background=t;
})();

var camera=new T.PerspectiveCamera(62,1,.1,420);

/* metallic reflection environment */
(function(){
  var c=document.createElement('canvas'); c.width=1024; c.height=512; var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#0a1230'); g.addColorStop(.30,'#2b4a86'); g.addColorStop(.47,'#ffd9a0'); g.addColorStop(.5,'#fff3dc');
  g.addColorStop(.54,'#2a3550'); g.addColorStop(1,'#080b14');
  x.fillStyle=g; x.fillRect(0,0,1024,512);
  var cols=['#ffffff','#7fe9ff','#ffd27a','#ff9bb5'];
  for(var i=0;i<26;i++){
    x.fillStyle=cols[i%4]; x.globalAlpha=.55+Math.random()*.4;
    var w=14+Math.random()*60, h=20+Math.random()*90;
    x.fillRect(Math.random()*1024,40+Math.random()*190,w,h);
  }
  x.globalAlpha=1;
  var t=new T.CanvasTexture(c); t.mapping=T.EquirectangularReflectionMapping; t.encoding=T.sRGBEncoding;
  var pm=new T.PMREMGenerator(renderer);
  scene.environment=pm.fromEquirectangular(t).texture;
  pm.dispose(); t.dispose();
})();

/* lights */
scene.add(new T.HemisphereLight(0x9ab8ff,0x20122a,.55));
var sun=new T.DirectionalLight(0xfff0d0,1.7);
sun.castShadow=true;
sun.shadow.mapSize.set(coarse?1024:2048,coarse?1024:2048);
var sc=sun.shadow.camera; sc.left=-17; sc.right=17; sc.top=36; sc.bottom=-36; sc.near=1; sc.far=80;
sun.shadow.bias=-0.0006;
scene.add(sun); scene.add(sun.target);
var glow=new T.PointLight(0x3be3ff,1.6,9,2);
scene.add(glow);

/* ---------- shared materials / geometry ---------- */
function M(color,metal,rough,extra){return new T.MeshStandardMaterial(Object.assign({color:color,metalness:metal,roughness:rough},extra||{}));}
function G(color){return new T.MeshBasicMaterial({color:color});}
var mat={
  chrome:M(0xdfe7f3,1,.12), steel:M(0x8794a8,1,.28), dark:M(0x1b2230,.9,.4), gold:M(0xf0bf5e,1,.2),
  crimson:M(0xc4203f,.9,.28), violet:M(0x6a4cff,.95,.22), copper:M(0xc86b3c,1,.25), teal:M(0x1fb5c9,.95,.2),
  gCyan:G(0x3be3ff), gGold:G(0xffc857), gRed:G(0xff4466), gViolet:G(0xb18cff), gOrange:G(0xff8a3d)
};
var geo={
  box:new T.BoxGeometry(1,1,1), cyl:new T.CylinderGeometry(1,1,1,18), cone:new T.ConeGeometry(1,1,12),
  sph:new T.SphereGeometry(1,22,16), tor:new T.TorusGeometry(1,.07,12,48), torT:new T.TorusGeometry(1,.14,12,40),
  oct:new T.OctahedronGeometry(1), taper:new T.CylinderGeometry(.35,.62,2.4,8), hex:new T.CylinderGeometry(1,1,1,6)
};
function add(parent,g,m,s,p,cast,rot){
  var o=new T.Mesh(g,m); o.scale.set(s[0],s[1],s[2]); o.position.set(p[0],p[1],p[2]);
  if(rot) o.rotation.set(rot[0],rot[1],rot[2]);
  o.castShadow=(cast!==false); parent.add(o); return o;
}

/* ---------- floor, rails, decor ---------- */
var floorTex;
(function(){
  var S=1024, c=document.createElement('canvas'); c.width=S; c.height=S; var x=c.getContext('2d');
  var lw=S/LANES, i, j;
  for(i=0;i<LANES;i++){
    var g=x.createLinearGradient(i*lw,0,(i+1)*lw,0);
    var a=i%2?'#1b2333':'#202a3c';
    g.addColorStop(0,'#141b29'); g.addColorStop(.5,a); g.addColorStop(1,'#141b29');
    x.fillStyle=g; x.fillRect(i*lw,0,lw,S);
  }

function toast(msg){

  toastTO=setTimeout(function(){ t.hidden=true; },2800);
}
function renderBoss(){
  var v=monster?Math.max(0,Math.round(monster.hp/monster.maxHp*100)):-1;
  if(v===bossC) return; bossC=v;
  $('boss').hidden=(v<0);
  if(v>=0) $('bossBar').style.width=v+'%';
}
function clearCombat(){
  if(monster){ scene.remove(monster.g); monster=null; }
  var i;
  for(i=0;i<bullets.length;i++) scene.remove(bullets[i].o);
  for(i=0;i<fireballs.length;i++) scene.remove(fireballs[i].o);
  bullets.length=0; fireballs.length=0; warnMesh.visible=false; respawnT=2.5; renderBoss();
}
function spawnMonster(){
  var b=buildMonster(), st=monStats(level), lane=randInt(2,LANES-3);
  monster={g:b.g,p:b.p,hp:st.hp,maxHp:st.hp,lane:lane,x:laneX(lane),tx:laneX(lane),z:-78,mode:'enter',modeT:0,t:0,
    switchT:1,shootT:1.8,chargeT:st.chargeCd,flash:0};
  monster.g.position.set(monster.x,0,monster.z); scene.add(monster.g);
  if(!seenMonster){ seenMonster=true; toast('ظهر الوحش! اضغط زر النار للتصدي له'); }
  renderBoss();
}
function shootFire(st){
  var m=monster, ln=clamp(Math.round(m.x/LW+MID),0,LANES-1), ls=(level>=8)?[ln-1,ln,ln+1]:[ln];
  for(var i=0;i<ls.length;i++){
    var l=ls[i]; if(l<0||l>=LANES) continue;
    var f=buildFire(); f.position.set(laneX(l),1.3,m.z+1.6); scene.add(f);
    fireballs.push({o:f,x:laneX(l),z:m.z+1.6,v:st.fbv});
  }
  beep(220,.25,'sawtooth',.08,120);
}
function fire(){
  if(state!=='playing'||level<3) return;
  if(clock-lastFire<.26) return;
  lastFire=clock; fireT=.18;
  var b=buildBullet(); b.position.set(px,1.45,-.8); scene.add(b);
  bullets.push({o:b,x:px,z:-.8,pz:-.8});
  beep(880,.07,'square',.05,440);
}
function killMonster(){
  var m=monster, st=monStats(level), pts=150+level*25, i;
  burst(m.x,2.5,m.z,0xffc857,30); burst(m.x,3.2,m.z,0xff4466,24); burst(m.x,1.5,m.z,0xb18cff,20);
  scene.remove(m.g); monster=null; warnMesh.visible=false;
  for(i=0;i<fireballs.length;i++) scene.remove(fireballs[i].o);
  fireballs.length=0;
  bonus+=pts; shake=.35; beep(140,.5,'sawtooth',.18,40);
  respawnT=st.respawn; renderBoss(); renderHUD(); toast('أسقطت الوحش! +'+pts);
}
function damageMonster(b){

  burst(b.x,2.2,m.z+1.2,0xffc857,6); beep(520,.05,'square',.05,260);
  if(m.hp<=0) killMonster(); else renderBoss();
}
function updateCombat(dt){
  if(state!=='playing') return;
  var m=monster, st, i;
  if(!m){
    if(level>=3){ respawnT-=dt; if(respawnT<=0) spawnMonster(); }
    warnMesh.visible=false;
  } else {
    st=monStats(level); m.t+=dt;
    if(m.mode==='enter'){ m.z=Math.min(MON_Z,m.z+42*dt); if(m.z>=MON_Z) m.mode='patrol'; }
    else if(m.mode==='patrol'){
      m.switchT-=dt; m.shootT-=dt; m.chargeT-=dt;
      if(m.switchT<=0){ m.switchT=st.sw*(.8+Math.random()*.5); m.lane=(Math.random()<st.aim)?targetLane:randInt(0,LANES-1); m.tx=laneX(m.lane); }
      if(m.shootT<=0){ m.shootT=st.shoot*(.85+Math.random()*.3); shootFire(st); }
      if(level>=6&&m.chargeT<=0){ m.mode='tele'; m.modeT=st.tele; m.lane=targetLane; m.tx=laneX(m.lane); }
    } else if(m.mode==='tele'){
      m.modeT-=dt; if(m.modeT<=0) m.mode='charge';
    } else if(m.mode==='charge'){
      m.z+=52*dt;
      if(invuln<=0&&Math.abs(m.z)<1.7&&Math.abs(px-m.x)<1.05) damage(px);
      if(m.z>5) m.mode='return';
    } else if(m.mode==='return'){
      m.z-=34*dt;
      if(m.z<=MON_Z){ m.z=MON_Z; m.mode='patrol'; m.chargeT=st.chargeCd*(.8+Math.random()*.4); m.shootT=Math.max(m.shootT,.8); }
    }
    if(m.mode!=='charge'){ var dx=m.tx-m.x, step=st.vx*dt; if(Math.abs(dx)<=step) m.x=m.tx; else m.x+=(dx>0?step:-step); }
    m.g.position.set(m.x,Math.abs(Math.sin(m.t*3))*.12,m.z);
    var sw=Math.sin(m.t*3.2); m.p.armL.sh.rotation.x=sw*.5; m.p.armR.sh.rotation.x=-sw*.5;
    var pre=(m.mode==='patrol'&&m.shootT<.4)||m.mode==='tele', es=pre?1.9:1+.15*Math.sin(m.t*8);
    m.p.eyes[0].scale.set(.16*es,.1*es,.1*es); m.p.eyes[1].scale.set(.16*es,.1*es,.1*es);
    m.p.ring.rotation.z+=dt*2;
    if(m.flash>0){ m.flash-=dt; m.g.scale.setScalar(1.05); } else m.g.scale.setScalar(1);
    if(m.mode==='tele'||m.mode==='charge'){
      var len=6-m.z; warnMesh.visible=true; warnMesh.scale.set(LW*.92,.02,len); warnMesh.position.set(m.x,.05,m.z+len/2);
      warnMat.opacity=.28+.3*Math.abs(Math.sin(clock*16));
    } else warnMesh.visible=false;
  }
  if(state!=='playing') return;
  for(i=bullets.length-1;i>=0;i--){
    var b=bullets[i]; b.pz=b.z; b.z-=95*dt; b.o.position.z=b.z;
    var gone=false;
    if(monster){
      var lo=Math.min(b.z,b.pz), hi=Math.max(b.z,b.pz);
      if(hi>=monster.z-1.3&&lo<=monster.z+1.3&&Math.abs(b.x-monster.x)<1.15){ damageMonster(b); gone=true; }
    }
    if(gone||b.z<-110){ scene.remove(b.o); bullets.splice(i,1); }
  }
  for(i=fireballs.length-1;i>=0;i--){

var state='menu', level=1, dist=0, bonus=0, lives=MAX_LIVES, targetLane=4, px=laneX(4), speed=0;

function speedFor(L){return 15+(L-1)*2.7;}
function timeGap(L){return 1.15-(L-1)*.063;}
function curGap(){return speedFor(level)*timeGap(level);}

function removeItem(it){ scene.remove(it.obj); var i=items.indexOf(it); if(i>=0) items.splice(i,1); }
function clearObstacles(){ for(var i=items.length-1;i>=0;i--) if(items[i].kind==='obs'){ scene.remove(items[i].obj); items.splice(i,1); } }
function clearAll(){ for(var i=items.length-1;i>=0;i--){ scene.remove(items[i].obj); } items.length=0; }

function heartNear(lane,z){ for(var i=0;i<items.length;i++){ var it=items[i]; if(it.kind==='heart'&&it.lane===lane&&Math.abs(it.z-z)<9) return true; } return false; }
function addItem(kind,lane,z,obj){
  obj.position.set(laneX(lane),0,z); scene.add(obj);
  var it={kind:kind,lane:lane,x:laneX(lane),z:z,obj:obj,hit:false}; items.push(it); return it;
}
function pickWidth(L){
  if(L<=3) return 1;
  var r=Math.random();
  if(L<=6){ var p1={4:.7,5:.55,6:.4}[L]; return r<p1?1:2; }
  var tb={7:[.25,.45],8:[.2,.4],9:[.15,.35],10:[.1,.3]}[L];
  if(r<tb[0]) return 1; if(r<tb[0]+tb[1]) return 2; return 3;
}
function addCluster(z,w,start){
  var base=randInt(0,4);
  var slide=(level>=6&&Math.random()<Math.min(.6,(level-5)*.12));
  for(var i=0;i<w;i++){
    var lane=start+i; if(heartNear(lane,z)) continue;
    var it=addItem('obs',lane,z,builders[(base+i)%5]());
    if(slide) it.slide={amp:LW*(1+Math.random()*.8),spd:1.6+Math.random()*1.4+level*.1,ph:Math.random()*6.28,cx:it.x};
  }
}
function spawnRow(z){
  var w=pickWidth(level), start;
  if(Math.random()<.72) start=clamp(targetLane-randInt(0,w-1),0,LANES-w); else start=randInt(0,LANES-w);
  addCluster(z,w,start);
  /* advanced levels: a second cluster in the same row */
  if(level>=5&&Math.random()<Math.min(.65,(level-4)*.11)){
    var w2=(level>=9&&Math.random()<.5)?2:1, s2, tries=0;
    do{ s2=randInt(0,LANES-w2); tries++; }while(tries<6&&s2<start+w&&s2+w2>start);
    addCluster(z,w2,s2);
  }
  /* advanced levels: a second row right behind the first */
  if(level>=7&&Math.random()<Math.min(.5,(level-6)*.14)){
    addCluster(z+8,pickWidth(level)>1?2:1,randInt(0,LANES-2));
  }
}
function prepopulate(startZ){
  var gap=curGap(), z=startZ, last=startZ;
  while(z>SPAWN_Z){ spawnRow(z); last=z; z-=gap; }
  lastRowZ=last;
}
function spawnHeart(k){
  var lane=randInt(1,LANES-2), z=-(HEART_EVERY*k-dist);
  for(var i=items.length-1;i>=0;i--){ var it=items[i]; if(it.kind==='obs'&&it.lane===lane&&Math.abs(it.z-z)<11){ scene.remove(it.obj); items.splice(i,1); } }
  addItem('heart',lane,z,buildHeart());
}

var pGeo=new T.BoxGeometry(.14,.14,.14), pMats={};
function burst(x,y,z,color,n){
  var m=pMats[color]||(pMats[color]=new T.MeshBasicMaterial({color:color}));
  for(var i=0;i<n;i++){
    var o=new T.Mesh(pGeo,m); o.position.set(x,y,z); scene.add(o);
    var a=Math.random()*Math.PI*2, sp=2+Math.random()*5;
    parts.push({o:o,vx:Math.cos(a)*sp,vy:2+Math.random()*5,vz:Math.sin(a)*sp,life:.7+Math.random()*.5,max:1.2});

}
function updateParts(dt,dz){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.life-=dt; p.vy-=16*dt;
    p.o.position.x+=p.vx*dt; p.o.position.y=Math.max(.05,p.o.position.y+p.vy*dt); p.o.position.z+=p.vz*dt+dz;
    p.o.scale.setScalar(Math.max(.01,p.life/p.max));

/* ---------- main update ---------- */
function stepWorld(dz){
  floorTex.offset.y+=dz/TILE;
  for(var i=0;i<towers.length;i++){ var t=towers[i]; t.position.z+=dz; if(t.position.z>25) t.position.z-=TOWER_SPAN; }
}
function update(dt){
  clock+=dt;
  var lean=clamp((laneX(targetLane)-px)*.1,-.35,.35);
  if(state==='menu'||state==='level'){
    stepWorld(8*dt); animRunner(dt,8,0,clock);
    px+=(laneX(targetLane)-px)*Math.min(1,dt*10);
    if(state==='level'){
      levelTimer-=dt; var c=Math.max(1,Math.ceil(levelTimer)); if(String(c)!==$('lvCount').textContent) $('lvCount').textContent=c;
      if(levelTimer<=0) nextLevel();
    }
  } else if(state==='playing'){
    speed=speedFor(level);
    var dz=speed*dt; dist+=dz;
    stepWorld(dz);
    px+=(laneX(targetLane)-px)*Math.min(1,dt*15);
    if(invuln>0) invuln-=dt;
    lastRowZ+=dz;
    if(lastRowZ-SPAWN_Z>=curGap()){ spawnRow(SPAWN_Z); lastRowZ=SPAWN_Z; }
    while(nextHeartK*HEART_EVERY<=FINISH && dist+(-SPAWN_Z)>=nextHeartK*HEART_EVERY){ spawnHeart(nextHeartK); nextHeartK++; }
    for(var i=items.length-1;i>=0;i--){
      var it=items[i]; it.z+=dz; it.obj.position.z=it.z;
      var tk=it.obj.userData.tick; if(tk) tk(clock,dt);
      if(it.slide){ it.x=clamp(it.slide.cx+Math.sin(clock*it.slide.spd+it.slide.ph)*it.slide.amp,laneX(0),laneX(LANES-1)); it.obj.position.x=it.x; }
      if(it.z>10){ scene.remove(it.obj); items.splice(i,1); continue; }
      if(Math.abs(it.z)<.95){
        if(it.kind==='obs'){ if(invuln<=0&&Math.abs(px-it.x)<.72){ hit(it); if(state==='dying') break; } }
        else if(Math.abs(px-it.x)<.95){ pickHeart(it); }
      }
    }
    updateCombat(dt);
    animRunner(dt,speed,lean,clock);
    root.visible=(invuln<=0)||(Math.floor(clock*14)%2===0);
    if(state==='playing'&&dist>=level*LEVEL_LEN){ dist=level*LEVEL_LEN; renderHUD(); endLevel(); }
    else renderHUD();
  } else if(state==='dying'){
    dyingTimer-=dt;
    root.visible=true; root.rotation.x=Math.min(1.4,(1.1-dyingTimer)*1.6); root.position.y=Math.max(-.2,root.position.y-dt*0.3);
    if(dyingTimer<=0){ root.position.y=0; root.rotation.x=0; gameOver(); }
  }
  /* player placement */
  root.position.x=px; if(state!=='dying') root.position.y=0;
  glow.position.set(px,2.2,1.4);
  sun.position.set(px+7,22,8); sun.target.position.set(px,0,-12); sun.target.updateMatrixWorld();
  updateParts(dt,state==='playing'?speed*dt:0);
  /* camera */
  shake=Math.max(0,shake-dt*1.6);
  var sx=(Math.random()-.5)*shake*.5, sy=(Math.random()-.5)*shake*.4;
  if(state==='menu'){
    camera.position.set(Math.sin(clock*.35)*3.2,3.4,7.4); camera.lookAt(0,1.4,-8);
  } else {
    camera.position.set(px*.72+sx,(camera.userData.y||5.2)+sy,camera.userData.z||9.4); camera.lookAt(px*.88,1.2,-12);
  }
}

  camera.userData.y=a<.75?6.8:(a<1.1?6:5.2); camera.userData.z=a<.75?12.2:(a<1.1?10.6:9.4);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize); resize();

if(best>0){ var bm=$('bestMenu'); bm.hidden=false; bm.textContent=bestText(); }
setState('menu');
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
